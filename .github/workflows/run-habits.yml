name: Run habit script

on:
  # No schedule here on purpose. GitHub was running scheduled jobs 5-6 hours
  # late, so the Cloudflare Worker (notion-reminder-worker) starts this
  # workflow at exactly 3:05 AM New York time via workflow_dispatch.
  #
  # Don't add a schedule back as a "backup": the weekly and monthly metrics
  # snapshots aren't safe to run twice, so a second run on a Sunday or the
  # 1st would create duplicate metrics entries.
  #
  # You can still run it by hand from the Actions tab ("Run workflow").
  workflow_dispatch:

jobs:
  run-habit-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Explicit minimum permissions. The job only needs to read the repo;
    # it does not write back to git, push artifacts, or call the GitHub API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run habit scheduler
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          HABITS_DB_ID: ${{ secrets.HABITS_DB_ID }}
          HABIT_LOG_DB_ID: ${{ secrets.HABIT_LOG_DB_ID }}
          HABIT_CONTROL_DB_ID: ${{ secrets.HABIT_CONTROL_DB_ID }}
          HABIT_METRICS_DB_ID: ${{ secrets.HABIT_METRICS_DB_ID }}
        run: python type1_habit_log_scheduler.py
