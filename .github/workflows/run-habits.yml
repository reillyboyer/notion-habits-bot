name: Run habit script

on:
  schedule:
    # Daily at 8:05 UTC = 3:05 AM EST / 4:05 AM EDT.
    #
    # Two deliberate choices here:
    #
    # 1. :05 rather than :00. GitHub's own docs warn that the top of every
    #    hour is a high-load window and that queued jobs may be dropped when
    #    load is high enough. Runs at :00 were landing 5-7 hours late.
    #
    # 2. 8:05 UTC rather than 7:05 UTC. Cron here is always UTC and does not
    #    follow daylight saving, so a fixed time drifts by an hour twice a
    #    year. 7:05 UTC would be 3:05 AM in summer but 2:05 AM in winter --
    #    before the 3 AM day boundary, so the script would generate logs for
    #    the previous habit day. 8:05 UTC is never earlier than 3:05 AM local.
    - cron: '5 8 * * *'
  workflow_dispatch:

jobs:
  run-habit-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Explicit minimum permissions. The job only needs to read the repo;
    # it does not write back to git, push artifacts, or call the GitHub API.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run habit scheduler
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          HABITS_DB_ID: ${{ secrets.HABITS_DB_ID }}
          HABIT_LOG_DB_ID: ${{ secrets.HABIT_LOG_DB_ID }}
          HABIT_CONTROL_DB_ID: ${{ secrets.HABIT_CONTROL_DB_ID }}
          HABIT_METRICS_DB_ID: ${{ secrets.HABIT_METRICS_DB_ID }}
        run: python type1_habit_log_scheduler.py
